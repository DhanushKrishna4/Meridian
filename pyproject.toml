[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-causal"
version = "0.1.0"
description = "A local causal laboratory: evidence, alternative explanations, interventions and counterfactuals"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "build==1.3.0"]

[project.scripts]
meridian = "meridian_causal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["reference: optional development reference comparisons", "exhaustive: exhaustive small graph verification"]
